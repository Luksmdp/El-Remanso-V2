spring.application.name=elremansov2
spring.output.ansi.enabled=ALWAYS

# Database
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Reintentos de conexi�n a la base de datos
spring.datasource.hikari.connection-timeout=60000
spring.datasource.initialization-fail-timeout=60000

# File Upload
file.upload-dir=${FILE_UPLOAD_DIR}
spring.web.resources.static-locations=file:${file.upload-dir}

# JWT
jwt.secret=${JWT_SECRET}

# Redis
spring.redis.host=redis
spring.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# Reintentos de conexi�n a RabbitMQ
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000
spring.rabbitmq.template.retry.max-attempts=5

# Logging
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG